# A temporary job: it makes the package joint with the template CLI and uploads the change as a patch. It goes away before the merge.
name: tmp-joint-scaffold

on:
  push:
    branches: [joint-corpus]

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package add joint --preset=node
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter ./packages/joint add "@mark1russell7/layout-contract@workspace:*" "@mark1russell7/packing@^0.2.1"
      - run: |
          git add -A -N .
          git diff --binary -- . ':!.github/workflows/tmp-joint-scaffold.yml' > scaffold.patch
          git status --short
          wc -l scaffold.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joint-scaffold
          path: scaffold.patch
