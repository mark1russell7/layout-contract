# The memory probe of L77 and the memory gate of L81 (`docs/JOINT-BENCH.md`). It runs the joint bench on single inputs under a stated heap mode.
# Each job runs one input with one mode, and writes the memory facts of each pair and the records.
# The input `families` (the default) gives the largest input of each family of the corpus: `bench.mjs families`. Thus the gate cannot leave out a family.
# The seeds of a family often have the same planned cost. Then the job of the family probes each of these seeds, one after the other, each in its own process.
# The gate examines each seed. A gate on seed 1 alone is a gate on a chosen input: the seeds of the dense input with hubs peaked from 3438 MB to 4287 MB.
# The mode `bench-6144` uses the heap cap of the joint bench without forced GC. It gives the peak RSS of the input alone.
# The mode `gc-6144` forces a full GC after each pair, so the probe gives the live heap that each pair keeps.
# The modes `cap-3072` and `cap-2048` lower the heap cap without forced GC, so the probe gives the peak RSS and the records under the cap.
# The mode `alloc-6144` has the heap cap of `bench-6144` and samples the allocations of each pair (alloc.jsonl). It is a diagnostic, not a gate mode.
# The input `pairs` runs only these pairs of each input (L81 step 2). A gate of such a run is a diagnostic too.
# The mode `measure-6144` has the heap cap of `bench-6144`, samples the allocations and forces a full GC after each pair. Its summary.jsonl gives the allocation and the retained heap of each input.
# The input `repeats` runs each job that count of times, each in its own job and artifact (the A/A repeat of L81). The gate examines each repeat.
# The job gate examines each probe. It fails when an input has no probe, an OOM or another error, or a peak RSS of the ceiling or more.
# In families, each seed of input F also gets a job in the mode measure-6144. The gate compares its allocation and live heap with MEMORY_LIMITS.
name: Memory probe

on:
  workflow_dispatch:
    inputs:
      inputs:
        description: "families, or the input ids of joint-v2 with commas between them. Each input gets its own job for each mode. In families, each family gets one job for each mode, and each input with limits gets one measure-6144 job."
        type: string
        default: "families"
      modes:
        description: "The heap modes, with commas between them: bench-6144, gc-6144, cap-3072, cap-2048, alloc-6144, measure-6144."
        type: string
        default: "bench-6144"
      limit-mb:
        description: "The ceiling of the gate: the peak RSS in MB that each probe stays under. It is a guard against a crash (docs/JOINT-BENCH.md)."
        type: string
        default: "5791"
      pairs:
        description: "Empty for each pair, or the pair ids with commas between them, for example maxrects-cp+gaps. Each input then runs only these pairs."
        type: string
        default: ""
      repeats:
        description: "The count of the runs of each job, from 1 to 9. Each run has its own job and artifact."
        type: string
        default: "1"
  # The nightly gate on main finds a change that brings a peak back within a day. It uses the defaults of the inputs.
  # It starts when the sweep on main ends, also after a failed sweep. Thus the heavy jobs of the two nights do not overlap (the fleet rule of 2026-10-30).
  workflow_run:
    workflows: [Sweep]
    types: [completed]
    branches: [main]
  # The schedule is the fallback for a night with no sweep. It stops when a sweep on main started on the same day.
  schedule:
    # Each scheduled heavy run of the fleet has its own minute (the rule of 2026-10-30).
    - cron: "4 5 * * *"

# A new run on the same ref waits for the run before it. A gate record that runs halfway has no value when it stops.
# The event is in the key: GitHub keeps one pending run per group, and a dispatch with other inputs must not cancel a pending gate (fleet STRATEGY 0e36301bc).
concurrency:
  group: memory-probe-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# A scheduled run has no inputs, so each input has its default here too.
env:
  INPUTS: ${{ inputs.inputs || 'families' }}
  MODES: ${{ inputs.modes || 'bench-6144' }}
  LIMIT: ${{ inputs.limit-mb || '5791' }}
  PAIRS: ${{ inputs.pairs || '' }}
  REPEATS: ${{ inputs.repeats || '1' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.changed.outputs.skip }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # A nightly run stops here in two cases. It has no new data.
      # (1) The last nightly gate examined the same commit of main. Only a run whose job gate passed or failed counts, because a run that stopped here also ends as a success.
      # (2) A scheduled run is the fallback, and a sweep on main started today. The end of that sweep starts the gate.
      # A skip is green only after a pass. When the last nightly gate failed on this commit, the plan fails at no heavy cost. A new commit of main or a rerun of the failed run ends it.
      # On 2026-10-31 and 2026-11-01 a skip after the failed gate of 2026-10-30 ended as a green run.
      # A failed read does not stop the gate. Each read has 4 tries with a backoff. After that the plan states it and the gate runs, the safe side.
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          skip=false
          read_api() { for pause in 5 20 60; do if "$@"; then return 0; fi; sleep "$pause"; done; "$@"; }
          if [ "$EVENT" = schedule ]; then
            today="$(date -u +%Y-%m-%d)"
            sweeps="$(read_api gh run list -R "$REPO" --workflow sweep.yml --branch main --limit 10 --json createdAt --jq "[.[] | select(.createdAt >= \"$today\")] | length")" || { echo "::warning::The read of the sweeps failed after 4 tries, so this fallback run goes on." | tee -a "$GITHUB_STEP_SUMMARY"; sweeps=0; }
            if [ "$sweeps" != 0 ]; then skip=true; echo "A sweep on main started on $today. The end of the sweep starts the gate, so this fallback run stops." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          fi
          if [ "$skip" = false ] && { [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_run ]; }; then
            last=""; result=""
            ids="$(read_api gh run list -R "$REPO" --workflow memory-probe.yml --branch main --status completed --limit 20 --json databaseId,event --jq '.[] | select(.event == "schedule" or .event == "workflow_run") | .databaseId')" || { echo "::warning::The read of the runs failed after 4 tries, so the gate runs." | tee -a "$GITHUB_STEP_SUMMARY"; ids=""; }
            for id in $ids; do
              row="$(read_api gh run view "$id" -R "$REPO" --json jobs,headSha --jq '[.jobs[] | select(.name == "gate" and (.conclusion == "success" or .conclusion == "failure")) | .conclusion] as $gate | if ($gate | length) > 0 then "\(.headSha) \($gate[0])" else "" end')" || { echo "::warning::The read of the run $id failed after 4 tries, so the gate runs." | tee -a "$GITHUB_STEP_SUMMARY"; break; }
              if [ -n "$row" ]; then last="${row%% *}"; result="${row##* }"; break; fi
            done
            if [ "$last" = "$SHA" ] && [ "$result" = failure ]; then echo "::error::The last nightly gate failed on $SHA, and main has not changed. This run stops and stays red." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
            if [ "$last" = "$SHA" ]; then skip=true; echo "The last nightly gate passed on $SHA. This run stops." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.changed.outputs.skip != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changed.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - if: steps.changed.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - id: plan
        if: steps.changed.outputs.skip != 'true'
        working-directory: packages/joint
        run: |
          case "$LIMIT" in ''|*[!0-9]*) echo "The limit is a count of MB, not $LIMIT."; exit 1;; esac
          for m in ${MODES//,/ }; do
            case "$m" in bench-6144|gc-6144|cap-3072|cap-2048|alloc-6144|measure-6144) ;; *) echo "The mode is bench-6144, gc-6144, cap-3072, cap-2048, alloc-6144 or measure-6144, not $m."; exit 1;; esac
          done
          case "$PAIRS" in *[!A-Za-z0-9+,_-]*) echo "The pairs $PAIRS have a character that is not allowed."; exit 1;; esac
          case "$REPEATS" in [1-9]) ;; *) echo "The repeats are a count from 1 to 9, not $REPEATS."; exit 1;; esac
          limits=off
          if [ "$INPUTS" = families ]; then
            list="$(node scripts/bench.mjs families)"
            # The inputs of MEMORY_LIMITS (src/memory-gate.ts) get a job of their own in the mode measure-6144, for the limits of the allocation and of the live heap.
            limits=on
          else
            for i in ${INPUTS//,/ }; do
              case "$i" in joint-v2/*) ;; *) echo "An input id starts with joint-v2/, not $i."; exit 1;; esac
              case "$i" in *[!A-Za-z0-9./_-]*) echo "The input id $i has a character that is not allowed."; exit 1;; esac
            done
            list="$(printf '%s' "$INPUTS" | jq -Rc 'split(",") | map(select(. != ""))')"
          fi
          printf '%s' "$list" > groups.json
          # A failed command in a substitution does not stop the step, so the assignment is a command of its own.
          jobs="$(node scripts/bench.mjs jobs --groups groups.json --modes "$MODES" --repeats "$REPEATS" --limits "$limits")"
          echo "The plan has $(printf '%s' "$jobs" | jq length) jobs: $(printf '%s' "$list" | jq length) groups for each mode and repeat, and the limits are $limits." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # The longest shard of the full bench run 40971129437 took 67 minutes. A job of a family runs up to 3 seeds, one after the other, and a forced GC after each pair adds time.
    timeout-minutes: 340
    strategy:
      fail-fast: false
      # The account runs at most 20 jobs at once, for all repos together. The fleet rule of 2026-10-30 (STRATEGY.md) gives a heavy workflow 3 jobs at once, so gates and releases get runners.
      max-parallel: 3
      # Each job of the plan has an input group, a mode and a repeat (`bench.mjs jobs`).
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe each input of the group
        working-directory: packages/joint
        env:
          INPUT: ${{ matrix.input }}
          MODE: ${{ matrix.mode }}
        run: |
          case "$MODE" in
            bench-6144) flags="--max-old-space-size=6144" ;;
            gc-6144) flags="--expose-gc --max-old-space-size=6144" ;;
            cap-3072) flags="--max-old-space-size=3072" ;;
            cap-2048) flags="--max-old-space-size=2048" ;;
            alloc-6144) flags="--max-old-space-size=6144" ;;
            measure-6144) flags="--expose-gc --max-old-space-size=6144" ;;
          esac
          # Each input of the group gets its own process and its own folder, so the peak RSS of one seed does not include another seed.
          errors=0
          k=0
          for one in ${INPUT//,/ }; do
            k=$((k + 1))
            out="probe/$k"
            status=0
            node $flags scripts/bench.mjs probe --inputs "$one" ${PAIRS:+--pairs "$PAIRS"} --out "$out" || status=$?
            echo "The probe of $one ended with the status $status." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -f "$out/probe.md" ]; then cat "$out/probe.md" >> "$GITHUB_STEP_SUMMARY"; fi
            mkdir -p "$out"
            echo "$status" > "$out/status.txt"
            printf '%s\n' "$one" > "$out/input.txt"
            printf '%s\n' "$MODE" > "$out/mode.txt"
            if [ ! -f "$out/probe.jsonl" ]; then : > "$out/probe.jsonl"; fi
            # 134 is an abort of V8 (an OOM): the artifact records it, and the job passes. The gate fails on it. Each other status is an error of the probe.
            if [ "$status" != 0 ] && [ "$status" != 134 ]; then echo "::error::The probe of $one stopped with the status $status, not with an OOM."; errors=$((errors + 1)); fi
          done
          if [ "$errors" != 0 ]; then exit 1; fi
      - id: name
        env:
          INPUT: ${{ matrix.input }}
          MODE: ${{ matrix.mode }}
          REPEAT: ${{ matrix.repeat }}
        # The name has the repeat, so the artifacts of two repeats of one input do not collide.
        run: echo "name=probe-${MODE}-$(printf '%s' "$INPUT" | sha256sum | cut -c1-8)-r${REPEAT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.name.outputs.name }}
          path: packages/joint/probe/
          if-no-files-found: error

  gate:
    needs: [plan, probe]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: probe-*
          path: packages/joint/probes
      - name: Examine the probes
        working-directory: packages/joint
        env:
          EXPECTED: ${{ needs.plan.outputs.jobs }}
          # The sweep that this gate followed, for a run that the end of a sweep started.
          SWEEP_ID: ${{ github.event.workflow_run.id }}
          SWEEP_RESULT: ${{ github.event.workflow_run.conclusion }}
          SWEEP_URL: ${{ github.event.workflow_run.html_url }}
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p probes
          printf '%s' "$EXPECTED" > expected.json
          status=0
          node scripts/bench.mjs gate --probes probes --expected expected.json --limit-mb "$LIMIT" || status=$?
          if [ -n "$SWEEP_ID" ]; then
            printf '\nThis gate followed the sweep run [%s](%s), with the result %s.\n' "$SWEEP_ID" "$SWEEP_URL" "$SWEEP_RESULT" >> probes/gate.md
          else
            printf '\nThis gate followed no sweep. The event was %s.\n' "$EVENT" >> probes/gate.md
          fi
          cat probes/gate.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: memory-gate
          path: packages/joint/probes/gate.md
          if-no-files-found: error
