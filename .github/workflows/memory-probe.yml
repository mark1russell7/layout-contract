# The memory probe of L77 (`docs/JOINT-BENCH.md`). It runs the joint bench on single inputs under a stated heap mode.
# Each job runs one input with one mode, and writes the memory facts of each pair and the records.
# The mode `gc-6144` forces a full GC after each pair, so the probe gives the live heap that each pair keeps.
# The modes `cap-3072` and `cap-2048` lower the heap cap without forced GC, so the probe gives the peak RSS and the records under the cap.
name: Memory probe

on:
  workflow_dispatch:
    inputs:
      inputs:
        description: "The input ids of joint-v2, with commas between them. Each input gets its own job for each mode."
        type: string
        default: "joint-v2/rect-grid.freeWidth.convex.edge.extremeAspect.n1000.e-medium.bundled.nested.fixed.sp-margin/s1,joint-v2/rect-grid.freeAspect.polygon.none.extremeAspect.n1000.e-medium.random.flat.free.sp-margin/s1,joint-v2/rect-grid.freeWidth.holes.scattered.uniform.n1000.e-medium.clustered.flat.free.sp-margin/s1"
      modes:
        description: "The heap modes, with commas between them: gc-6144, cap-3072, cap-2048."
        type: string
        default: "gc-6144,cap-3072,cap-2048"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      inputs: ${{ steps.plan.outputs.inputs }}
      modes: ${{ steps.plan.outputs.modes }}
    steps:
      - id: plan
        env:
          INPUTS: ${{ inputs.inputs }}
          MODES: ${{ inputs.modes }}
        run: |
          for m in ${MODES//,/ }; do
            case "$m" in gc-6144|cap-3072|cap-2048) ;; *) echo "The mode is gc-6144, cap-3072 or cap-2048, not $m."; exit 1;; esac
          done
          for i in ${INPUTS//,/ }; do
            case "$i" in joint-v2/*) ;; *) echo "An input id starts with joint-v2/, not $i."; exit 1;; esac
            case "$i" in *[!A-Za-z0-9./_-]*) echo "The input id $i has a character that is not allowed."; exit 1;; esac
          done
          echo "inputs=$(printf '%s' "$INPUTS" | jq -Rc 'split(",") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          echo "modes=$(printf '%s' "$MODES" | jq -Rc 'split(",") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    runs-on: ubuntu-latest
    # The most costly input of joint-v2 took 81 minutes in run 40884908305. A forced GC after each pair adds time.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        input: ${{ fromJSON(needs.plan.outputs.inputs) }}
        mode: ${{ fromJSON(needs.plan.outputs.modes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe one input
        working-directory: packages/joint
        env:
          INPUT: ${{ matrix.input }}
          MODE: ${{ matrix.mode }}
        run: |
          case "$MODE" in
            gc-6144) flags="--expose-gc --max-old-space-size=6144" ;;
            cap-3072) flags="--max-old-space-size=3072" ;;
            cap-2048) flags="--max-old-space-size=2048" ;;
          esac
          status=0
          node $flags scripts/bench.mjs probe --inputs "$INPUT" --out probe || status=$?
          echo "The probe ended with the status $status." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f probe/probe.md ]; then cat probe/probe.md >> "$GITHUB_STEP_SUMMARY"; fi
          mkdir -p probe
          echo "$status" > probe/status.txt
          # 134 is an abort of V8 (an OOM): the artifact records it, and the job passes. Each other status is an error of the probe.
          if [ "$status" != 0 ] && [ "$status" != 134 ]; then echo "::error::The probe stopped with the status $status, not with an OOM."; exit 1; fi
      - id: name
        env:
          INPUT: ${{ matrix.input }}
          MODE: ${{ matrix.mode }}
        run: echo "name=probe-${MODE}-$(printf '%s' "$INPUT" | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.name.outputs.name }}
          path: packages/joint/probe/
          if-no-files-found: error
