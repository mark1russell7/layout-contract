# The nightly sweep over the joint strategy space (docs/SWEEP.md, roadmap item L35). It uses the bench code of packages/joint through scripts/sweep.mjs.
# The job plan reads the state of the sweep from the branch sweep-data, and plans round 1: the baseline arm on each input, and a sample of new configs on the screen.
# The date of the night seeds the sample. The cost model (data/cost-margins.json) gives the shards a planned cost near the target.
# Each shard of round 1 keeps its raw records as the artifact sweep-records-1-<shard>.
# The job race adds the records to the state, drops the configs that the paired verdict beats, halves the rest, and plans round 2.
# Round 2 gives the survivors the rest of the corpus, and the rest of the budget goes to new configs from the least covered strata.
# The job summarize writes the new tree of the data branch as the artifact sweep-data, and the summary of the night.
# It also fits the coverage surrogate, and appends its record to the trend of the epoch (L52).
# The job publish pushes that tree to the branch sweep-data. Only this job can write, and it never writes to main.
# A manual run with dry-run does not publish. A run from another branch than main does not publish.
# A second run of a date that the state has already skips the night.
# Only the times of these jobs count. The sweep does not run on a local computer.
name: Sweep

on:
  schedule:
    # Each scheduled heavy run of the fleet has its own minute (the rule of 2026-10-30).
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "The night of the run, YYYY-MM-DD. The default is today in UTC. It seeds the sample."
        type: string
        default: ""
      max-shards:
        description: "The largest count of the shards of each round."
        type: string
        default: "20"
      target-minutes:
        description: "The planned minutes of a shard."
        type: string
        default: "30"
      max-configs:
        description: "The largest count of new configs of each round."
        type: string
        default: "400"
      design:
        description: "The count of the rows of a Saltelli design for round 1 (L52), or empty for a normal night. Round 1 then runs the design instead of a new sample."
        type: string
        default: ""
      budget-minutes:
        description: "The wall minutes of the two rounds together, or empty for no budget. A scheduled night computes its budget from the window."
        type: string
        default: ""
      dry-run:
        description: "Run the night, but do not push to the branch sweep-data."
        type: boolean
        default: false

permissions:
  contents: read

# The event is in the key, so a dispatched sweep does not cancel a pending scheduled night (fleet STRATEGY 0e36301bc).
# Two nights can then run at the same time. The job publish of each one stops when the other pushed first.
concurrency:
  group: sweep-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_SHARDS: ${{ inputs.max-shards || '20' }}
  TARGET_MINUTES: ${{ inputs.target-minutes || '30' }}
  MAX_CONFIGS: ${{ inputs.max-configs || '400' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      date: ${{ steps.plan.outputs.date }}
      skip: ${{ steps.plan.outputs.skip }}
      end: ${{ steps.budget.outputs.end }}
      gate: ${{ steps.budget.outputs.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the branch sweep-data
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          if git fetch --depth 1 origin sweep-data; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/data"; else echo "The branch sweep-data does not exist yet. The night starts a new state."; fi
      # The budget of a night (L81). The window of a scheduled night ends at 14:00 UTC. The gate after the sweep takes its expected minutes from the window, but only when main changed since the last nightly gate.
      # The expected minutes of the gate come from the jobs of the last 3 nightly gates (`gateEstimate`), not from their wall time. Wall time mixes in the wait of a run in its concurrency group and the old count of lanes. With no budget, the plan has only the limits of the inputs.
      # A failed read does not stop the night. Each read has 4 tries with a backoff. After that the plan stops reading and states it. The fallback is 360 minutes, the safe side.
      - name: Compute the budget of the night
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BUDGET: ${{ inputs.budget-minutes }}
        run: |
          now="$(date -u +%s)"
          case "$BUDGET" in '') ;; *[!0-9]*) echo "The budget is a count of minutes, not $BUDGET."; exit 1;; *) echo "end=$((now + BUDGET * 60))" >> "$GITHUB_OUTPUT"; echo "gate=0" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if [ "$EVENT" != schedule ]; then echo "A dispatch with no budget-minutes has no budget."; exit 0; fi
          read_api() { for pause in 5 20 60; do if "$@"; then return 0; fi; sleep "$pause"; done; "$@"; }
          last=""; count=0; failed=""; gates="$RUNNER_TEMP/gates"; mkdir -p "$gates"
          ids="$(read_api gh run list -R "$REPO" --workflow memory-probe.yml --branch main --status completed --limit 20 --json databaseId,event --jq '.[] | select(.event == "schedule" or .event == "workflow_run") | .databaseId')" || { failed="the list of the runs"; ids=""; }
          for id in $ids; do
            read_api gh run view "$id" -R "$REPO" --json jobs,headSha > "$gates/$id.json" || { rm -f "$gates/$id.json"; failed="the run $id"; break; }
            if ! jq -e '[.jobs[] | select(.name == "gate" and (.conclusion == "success" or .conclusion == "failure"))] | length > 0' "$gates/$id.json" > /dev/null; then rm -f "$gates/$id.json"; continue; fi
            if [ -z "$last" ]; then last="$(jq -r .headSha "$gates/$id.json")"; fi
            count=$((count + 1))
            if [ "$count" -ge 3 ]; then break; fi
          done
          if [ -n "$failed" ]; then echo "::warning::The read of $failed failed after 4 tries. The budget uses only the runs that it read." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          # A fault in the estimate does not stop the night. It takes the fallback, and the summary states it.
          estimate="$(cd packages/joint && node scripts/sweep.mjs gate-estimate --runs "$gates")" || { echo "::warning::The estimate of the gate failed. The budget uses 360 minutes." | tee -a "$GITHUB_STEP_SUMMARY"; estimate="360 the fallback"; }
          gate="${estimate%% *}"
          echo "The gate estimate is $gate minutes: ${estimate#* }." | tee -a "$GITHUB_STEP_SUMMARY"
          case "$estimate" in *fallback*) fallback=true;; *) fallback=false;; esac
          if [ "$last" = "$SHA" ]; then gate=0; fi
          end="$(date -u -d "$(date -u +%Y-%m-%d) 14:00" +%s)"
          echo "The window ends at $(date -u -d "@$end" +%H:%M) UTC. The gate takes $gate minutes (the last nightly gate examined ${last:-no commit}). The rounds get $(( (end - now) / 60 - gate )) minutes." | tee -a "$GITHUB_STEP_SUMMARY"
          # The night record keeps these facts, so a thin budget shows on the page and not only in a warning of this log.
          jq -n --argjson gateMinutes "$gate" --arg estimate "${estimate#* }" --argjson runsRead "$count" --arg failed "$failed" --argjson fallback "$fallback" --arg windowEnd "$(date -u -d "@$end" +%Y-%m-%dT%H:%MZ)" --arg last "$last" '{gateMinutes: $gateMinutes, estimate: $estimate, runsRead: $runsRead, failedRead: (if $failed == "" then null else $failed end), fallback: $fallback, windowEnd: $windowEnd, lastGate: (if $last == "" then null else $last end)}' > "$RUNNER_TEMP/budget-facts.json" || { echo "::warning::The facts of the budget did not reach the night record." | tee -a "$GITHUB_STEP_SUMMARY"; rm -f "$RUNNER_TEMP/budget-facts.json"; }
          echo "end=$end" >> "$GITHUB_OUTPUT"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
      - name: Plan round 1
        id: plan
        working-directory: packages/joint
        env:
          DATE: ${{ inputs.date }}
          DESIGN: ${{ inputs.design }}
          END: ${{ steps.budget.outputs.end }}
          GATE: ${{ steps.budget.outputs.gate }}
        run: |
          date="${DATE:-$(date -u +%Y-%m-%d)}"
          case "$date" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "The date has the form YYYY-MM-DD, not $date."; exit 1;; esac
          for v in "$MAX_SHARDS" "$TARGET_MINUTES" "$MAX_CONFIGS"; do case "$v" in ''|*[!0-9]*) echo "The limits are numbers, not $v."; exit 1;; esac; done
          case "$DESIGN" in '') ;; *[!0-9]*) echo "The design is a count of rows, not $DESIGN."; exit 1;; esac
          # Round 1 gets half of the budget, and round 2 gets what is left at the race.
          budget=""
          if [ -n "$END" ]; then budget=$(( ((END - $(date -u +%s)) / 60 - GATE) / 2 )); if [ "$budget" -lt 30 ]; then budget=30; fi; fi
          node scripts/sweep.mjs plan --carry carry-request.json --scale 2 --data "$RUNNER_TEMP/data" --out night --date "$date" --max-shards "$MAX_SHARDS" --target-minutes "$TARGET_MINUTES" --max-configs "$MAX_CONFIGS" ${DESIGN:+--design "$DESIGN"} ${budget:+--budget-minutes "$budget" --lanes 3} --budget-facts "$RUNNER_TEMP/budget-facts.json"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "shards=$(cat night/matrix.json | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          if [ -f night/skip.txt ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-night-1
          path: packages/joint/night/
          if-no-files-found: error

  round1:
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # The plan gives each shard approximately 30 minutes. The limit leaves a margin of 4 times the target.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The account runs at most 20 jobs at once, for all repos together. The fleet rule of 2026-10-30 (STRATEGY.md) gives a heavy workflow 3 jobs at once, so gates and releases get runners.
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweep-night-1
          path: packages/joint/night
      - name: Run one shard
        working-directory: packages/joint
        env:
          SHARD: ${{ matrix.shard }}
          # The design night of 2026-10-29 (run 40890060521) went above the default heap of approximately 4 GB on inputs of 1000 boxes. The runner has 16 GB.
          NODE_OPTIONS: --max-old-space-size=6144
        # A shard stops cleanly at 90 minutes before a unit that does not end in time. At 100 minutes a parent process stops it, also in its first unit, keeps each finished record and writes a censored row (L115).
        # The step timeout is only a net, 15 minutes under the timeout of the job. The upload below then has the records.
        # On 2026-11-01 and 2026-11-03, 3 shards ran past the timeout of the job. A cancelled job leaves no artifact, so 1,057 pairs were lost. A death of the runner still loses a shard.
        timeout-minutes: 105
        run: node scripts/sweep.mjs run --plan night --shard "$SHARD" --out records --deadline-minutes 90 --hard-deadline-minutes 100
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sweep-records-1-${{ matrix.shard }}
          path: packages/joint/records/
          if-no-files-found: error

