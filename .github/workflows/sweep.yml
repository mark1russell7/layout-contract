# The nightly sweep over the joint strategy space (docs/SWEEP.md, roadmap item L35). It uses the bench code of packages/joint through scripts/sweep.mjs.
# The job plan reads the state of the sweep from the branch sweep-data, and plans round 1: the baseline arm on each input, and a sample of new configs on the screen.
# The date of the night seeds the sample. The cost model (data/cost-margins.json) gives the shards a planned cost near the target.
# Each shard of round 1 keeps its raw records as the artifact sweep-records-1-<shard>.
# The job race adds the records to the state, drops the configs that the paired verdict beats, halves the rest, and plans round 2.
# Round 2 gives the survivors the rest of the corpus, and the rest of the budget goes to new configs from the least covered strata.
# The job summarize writes the new tree of the data branch as the artifact sweep-data, and the summary of the night.
# The job publish pushes that tree to the branch sweep-data. Only this job can write, and it never writes to main.
# A manual run with dry-run does not publish. A run from another branch than main does not publish.
# A second run of a date that the state has already skips the night.
# Only the times of these jobs count. The sweep does not run on a local computer.
name: Sweep

on:
  schedule:
    # Each scheduled heavy run of the fleet has its own minute (the rule of 2026-10-30).
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "The night of the run, YYYY-MM-DD. The default is today in UTC. It seeds the sample."
        type: string
        default: ""
      max-shards:
        description: "The largest count of the shards of each round."
        type: string
        default: "20"
      target-minutes:
        description: "The planned minutes of a shard."
        type: string
        default: "30"
      max-configs:
        description: "The largest count of new configs of each round."
        type: string
        default: "400"
      design:
        description: "The count of the rows of a Saltelli design for round 1 (L52), or empty for a normal night. Round 1 then runs the design instead of a new sample."
        type: string
        default: ""
      dry-run:
        description: "Run the night, but do not push to the branch sweep-data."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sweep-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_SHARDS: ${{ inputs.max-shards || '20' }}
  TARGET_MINUTES: ${{ inputs.target-minutes || '30' }}
  MAX_CONFIGS: ${{ inputs.max-configs || '400' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      date: ${{ steps.plan.outputs.date }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the branch sweep-data
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          if git fetch --depth 1 origin sweep-data; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/data"; else echo "The branch sweep-data does not exist yet. The night starts a new state."; fi
      - name: Plan round 1
        id: plan
        working-directory: packages/joint
        env:
          DATE: ${{ inputs.date }}
          DESIGN: ${{ inputs.design }}
        run: |
          date="${DATE:-$(date -u +%Y-%m-%d)}"
          case "$date" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "The date has the form YYYY-MM-DD, not $date."; exit 1;; esac
          for v in "$MAX_SHARDS" "$TARGET_MINUTES" "$MAX_CONFIGS"; do case "$v" in ''|*[!0-9]*) echo "The limits are numbers, not $v."; exit 1;; esac; done
          case "$DESIGN" in '') ;; *[!0-9]*) echo "The design is a count of rows, not $DESIGN."; exit 1;; esac
          node scripts/sweep.mjs plan --data "$RUNNER_TEMP/data" --out night --date "$date" --max-shards "$MAX_SHARDS" --target-minutes "$TARGET_MINUTES" --max-configs "$MAX_CONFIGS" ${DESIGN:+--design "$DESIGN"}
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "shards=$(cat night/matrix.json | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          if [ -f night/skip.txt ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-night-1
          path: packages/joint/night/
          if-no-files-found: error

  round1:
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # The plan gives each shard approximately 30 minutes. The limit leaves a margin of 4 times the target.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The account runs at most 20 jobs at once, for all repos together. The fleet rule of 2026-10-30 (STRATEGY.md) gives a heavy workflow 3 jobs at once, so gates and releases get runners.
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweep-night-1
          path: packages/joint/night
      - name: Run one shard
        working-directory: packages/joint
        env:
          SHARD: ${{ matrix.shard }}
          # The design night of 2026-10-29 (run 40890060521) went above the default heap of approximately 4 GB on inputs of 1000 boxes. The runner has 16 GB.
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/sweep.mjs run --plan night --shard "$SHARD" --out records
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sweep-records-1-${{ matrix.shard }}
          path: packages/joint/records/
          if-no-files-found: error

  race:
    needs: [plan, round1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.race.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweep-night-1
          path: packages/joint/night
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sweep-records-1-*
          path: packages/joint/records
      - name: Race the configs and plan round 2
        id: race
        working-directory: packages/joint
        run: |
          node scripts/sweep.mjs race --night night --records records --out night2 --max-shards "$MAX_SHARDS" --target-minutes "$TARGET_MINUTES" --max-configs "$MAX_CONFIGS"
          echo "shards=$(cat night2/matrix.json | tr -d ' \n')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-night-2
          path: packages/joint/night2/
          if-no-files-found: error

  round2:
    needs: race
    if: ${{ !cancelled() && needs.race.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The account runs at most 20 jobs at once, for all repos together. The fleet rule of 2026-10-30 (STRATEGY.md) gives a heavy workflow 3 jobs at once, so gates and releases get runners.
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.race.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweep-night-2
          path: packages/joint/night2
      - name: Run one shard
        working-directory: packages/joint
        env:
          SHARD: ${{ matrix.shard }}
          # The design night of 2026-10-29 (run 40890060521) went above the default heap of approximately 4 GB on inputs of 1000 boxes. The runner has 16 GB.
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/sweep.mjs run --plan night2 --shard "$SHARD" --out records
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sweep-records-2-${{ matrix.shard }}
          path: packages/joint/records/
          if-no-files-found: error

  summarize:
    needs: [race, round2]
    if: ${{ !cancelled() && needs.race.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweep-night-2
          path: packages/joint/night2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sweep-records-2-*
          path: packages/joint/records
      - name: Read the branch sweep-data
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          if git fetch --depth 1 origin sweep-data; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/data"; fi
      - name: Summarize the night
        working-directory: packages/joint
        run: |
          node scripts/sweep.mjs summarize --night night2 --records records --data "$RUNNER_TEMP/data" --out "$RUNNER_TEMP/out" --run "$GITHUB_RUN_ID"
          cat "$RUNNER_TEMP/out/night.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-data
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  publish:
    needs: [plan, summarize]
    if: ${{ needs.summarize.result == 'success' && !inputs.dry-run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job writes. It pushes to the branch sweep-data, never to main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweep-data
          path: ${{ runner.temp }}/out
      - name: Push the data of the night to the branch sweep-data
        env:
          DATE: ${{ needs.plan.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin sweep-data; then git switch -C sweep-data FETCH_HEAD; else git switch --orphan sweep-data; fi
          git rm -r -q --cached --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/out/." .
          rm -f night.md
          git add -A
          if git diff --cached --quiet; then echo "The night gives no change."; exit 0; fi
          git commit -q -m "sweep: the night $DATE (run $GITHUB_RUN_ID)"
          git push origin HEAD:refs/heads/sweep-data
