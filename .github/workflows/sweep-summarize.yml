# Summarize again the night of an earlier run of sweep.yml, and push its data to the branch sweep-data (L81).
# Use it when the job summarize of a night failed after its rounds ended, for example because of a bug in sweep.mjs.
# It downloads the artifacts sweep-night-2 and sweep-records-2-* of that run. The rounds do not run again.
# It refuses a night that is not the next night of the branch sweep-data, so it never removes the data of a later night.
name: Sweep summarize

on:
  workflow_dispatch:
    inputs:
      run:
        description: "The id of the run of sweep.yml whose night to summarize."
        type: string
        required: true
      dry-run:
        description: "Summarize, but do not push to the branch sweep-data."
        type: boolean
        default: false

permissions:
  contents: read

# The group of sweep.yml, so a night and this job never write the branch at the same time.
concurrency:
  group: sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      date: ${{ steps.check.outputs.date }}
    steps:
      - name: Check the run id
        env:
          RUN: ${{ inputs.run }}
        run: |
          case "$RUN" in ''|*[!0-9]*) echo "The run is a run id, not $RUN."; exit 1;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweep-night-2
          path: packages/joint/night2
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sweep-records-2-*
          path: packages/joint/records
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - name: Read the branch sweep-data
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          if git fetch --depth 1 origin sweep-data; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/data"; fi
      - name: Check that the night is the next night of the branch
        id: check
        working-directory: packages/joint
        run: |
          node -e '
            const { existsSync, readFileSync } = require("node:fs");
            const read = (f) => JSON.parse(readFileSync(f, "utf8"));
            const state = read("night2/state.json");
            const date = read("night2/plan.json").date;
            const file = `${process.argv[1]}/epochs/${state.epoch}/state.json`;
            const before = existsSync(file) ? read(file).nights.map((n) => n.date) : [];
            const expected = state.nights.map((n) => n.date).slice(0, -1);
            if (state.nights.at(-1)?.date !== date) throw new Error(`The state of the run does not end with the night ${date}.`);
            if (JSON.stringify(before) !== JSON.stringify(expected)) throw new Error(`The branch has the nights ${before.join(", ") || "none"}, but the night ${date} comes after ${expected.join(", ") || "none"}. The job does not write over a later night.`);
            console.log(`The night ${date} is the next night of the branch.`);
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `date=${date}\n`);
          ' "$RUNNER_TEMP/data"
      - name: Summarize the night
        working-directory: packages/joint
        env:
          RUN: ${{ inputs.run }}
        run: |
          node scripts/sweep.mjs summarize --night night2 --records records --data "$RUNNER_TEMP/data" --out "$RUNNER_TEMP/out" --run "$RUN"
          cat "$RUNNER_TEMP/out/night.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-data
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  publish:
    needs: summarize
    if: ${{ !inputs.dry-run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job writes. It pushes to the branch sweep-data, never to main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweep-data
          path: ${{ runner.temp }}/out
      - name: Push the data of the night to the branch sweep-data
        env:
          DATE: ${{ needs.summarize.outputs.date }}
          RUN: ${{ inputs.run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin sweep-data; then git switch -C sweep-data FETCH_HEAD; else git switch --orphan sweep-data; fi
          git rm -r -q --cached --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/out/." .
          rm -f night.md
          git add -A
          if git diff --cached --quiet; then echo "The night gives no change."; exit 0; fi
          git commit -q -m "sweep: the night $DATE (run $RUN, summarized again by run $GITHUB_RUN_ID)"
          git push origin HEAD:refs/heads/sweep-data
