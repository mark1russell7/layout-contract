# The bench of `/text`. It compares the time of `layoutText` of the head with a release on npm.
# A pull request that changes the text module runs it, so the PR carries its numbers before it merges.
# The table goes to the summary of the job.
name: Text bench

on:
  pull_request:
    paths:
      - "packages/layout-contract/src/text.ts"
      - "packages/layout-contract/scripts/bench-text.mjs"
      - ".github/workflows/text-bench.yml"
  workflow_dispatch:
    inputs:
      base:
        description: "The version on npm to compare with. The default is the latest release."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the head
        working-directory: packages/layout-contract
        run: pnpm build
      - name: Install the base from npm
        env:
          BASE: ${{ inputs.base }}
        run: |
          base="${BASE:-$(npm view @mark1russell7/layout-contract version)}"
          case "$base" in *[!0-9.]*|'') echo "The base is a version, not $base."; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/base"
          npm install --prefix "$RUNNER_TEMP/base" --no-save --ignore-scripts "@mark1russell7/layout-contract@$base"
          echo "The base is $base." >> "$GITHUB_STEP_SUMMARY"
      - name: Run the bench
        working-directory: packages/layout-contract
        run: |
          node scripts/bench-text.mjs --base "$RUNNER_TEMP/base/node_modules/@mark1russell7/layout-contract/build/text.js" --head build/text.js | tee -a "$GITHUB_STEP_SUMMARY"
