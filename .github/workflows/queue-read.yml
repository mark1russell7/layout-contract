# The read of the wait of each pull request gate and release gate (docs/JOINT-BENCH.md, "The read of the gate waits"). It holds the trial of the memory gate to its stop line.
# This job has only GitHub API reads, and it holds one slot. The artifact of the last good run is its start, so a read that the rate limit cuts goes on in the next run.
name: Queue read

on:
  workflow_run:
    workflows: [Memory probe]
    types: [completed]
    branches: [main]
  schedule:
    # Each morning of the trial, also when the gate of the night has not ended. A gate that runs reaches the time of the read.
    - cron: "9 8 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: The count of days back that this run reads.
        required: false
        default: "10"

# Each commit of main has its own group, so each run of main ends with a result.
concurrency:
  group: queue-read-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The token of this job reads public repositories only. So the facts and the report name no private repository, and the check of `.private` states this.
      # The filter of the runs is wider than `gateKind` (src/gate-wait.ts), which decides. A finished run in the facts is not read again.
      - id: facts
        name: Read the runs and their jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          DAYS: ${{ inputs.days || '10' }}
        run: |
          set -o pipefail
          case "$DAYS" in ''|*[!0-9]*) echo "The days are a whole number, not $DAYS."; exit 1;; esac
          read_api() { for pause in 5 20 60; do if "$@"; then return 0; fi; sleep "$pause"; done; "$@"; }
          dir="$RUNNER_TEMP/queue-read"
          mkdir -p "$dir"
          last="$(read_api gh run list -R "$REPO" --workflow queue-read.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')" || last=""
          if [ -n "$last" ]; then
            gh run download "$last" -R "$REPO" -n queue-read -D "$dir" || echo "::warning::The artifact of run $last did not come, so this read starts with no facts." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          facts="$dir/facts.jsonl"
          touch "$facts"
          jq -r 'select(.status == "completed") | "\(.repo)/\(.id)"' "$facts" | sort -u > "$RUNNER_TEMP/known.txt"
          from="$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)"
          read_api gh api --paginate "users/$OWNER/repos?type=owner&sort=pushed&per_page=100" --jq ".[] | select(.private == false and (.archived | not) and .pushed_at >= \"$from\") | .name" | sort -u > "$RUNNER_TEMP/repos.txt"
          cut=0
          reads=0
          left=1000
          while IFS= read -r repo <&3; do
            if ! read_api gh api --paginate -X GET "repos/$OWNER/$repo/actions/runs" -f per_page=100 -f "created=>=$from" --jq ".workflow_runs[] | select((.event | startswith(\"pull_request\")) or .event == \"merge_group\" or ((.path + \" \" + .name) | ascii_downcase | contains(\"release\") or contains(\"memory-probe\"))) | select(.conclusion != \"skipped\" and .conclusion != \"cancelled\") | {repo: \"$repo\", id, name, path, event, status, conclusion, run_started_at}" > "$RUNNER_TEMP/runs.jsonl"; then
              echo "::warning::The read of the runs of $repo failed after 4 tries." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            while IFS= read -r run <&4; do
              id="$(jq -r .id <<< "$run")"
              status="$(jq -r .status <<< "$run")"
              if [ "$status" = completed ] && grep -qxF "$repo/$id" "$RUNNER_TEMP/known.txt"; then continue; fi
              if [ $((reads % 25)) = 0 ]; then left="$(gh api rate_limit --jq .resources.core.remaining || echo 0)"; fi
              if [ "$left" -lt 100 ]; then cut=$((cut + 1)); continue; fi
              reads=$((reads + 1))
              if ! jobs="$(read_api gh api --paginate "repos/$OWNER/$repo/actions/runs/$id/jobs?per_page=100&filter=latest" --jq '.jobs[] | {id, status, conclusion, created_at, started_at, completed_at}' | jq -sc 'unique_by(.id)')"; then
                cut=$((cut + 1))
                continue
              fi
              jq -c --argjson jobs "$jobs" '. + {jobs: $jobs}' <<< "$run" >> "$facts"
            done 4< "$RUNNER_TEMP/runs.jsonl"
          done 3< "$RUNNER_TEMP/repos.txt"
          echo "Repositories: $(wc -l < "$RUNNER_TEMP/repos.txt"). Job reads: $reads. Runs left out: $cut. Rate left: $left at the last read."
          echo "cut=$cut" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Write the report
        working-directory: packages/joint
        env:
          DIR: ${{ steps.facts.outputs.dir }}
          CUT: ${{ steps.facts.outputs.cut }}
        run: |
          node scripts/queue-read.ts "$DIR/facts.jsonl" "$DIR/report.md" "$DIR/rows.json" "$CUT"
          cat "$DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queue-read
          path: ${{ steps.facts.outputs.dir }}
          retention-days: 90
