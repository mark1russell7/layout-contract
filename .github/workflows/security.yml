# The security scans of this repository (reusable-security.yml, CI.md): dependency review,
# osv-scanner and CodeQL. A pull request fails only for a new finding at or above high.
# Other repositories call mark1russell7/template/.github/workflows/reusable-security.yml@<commit> # main
name: Security

on:
  pull_request:
  push:
    branches: [main]
  # A weekly scan finds the new advisories for the dependencies that do not change
  schedule:
    - cron: "32 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  security-ok:
    name: Security OK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: mark1russell7/template/.github/actions/security-scan@214dbed7b52dac94c0dce1c170162e75672a556d # main

  # The check that the ruleset of main names for the scans (template #81). It fails when a scan did not pass, also on a skip that ALLOW_SKIP does not name (template #85).
  # The scans stay in this file: release.yml calls ci.yml with contents: read, and a scan needs security-events: write.
