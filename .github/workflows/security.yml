# The security scans of this repository (reusable-security.yml, CI.md): dependency review,
# osv-scanner and CodeQL. A pull request fails only for a new finding at or above high.
# Other repositories call mark1russell7/template/.github/workflows/reusable-security.yml@<commit> # main
name: Security

on:
  pull_request:
  push:
    branches: [main]
  # A weekly scan finds the new advisories for the dependencies that do not change
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: mark1russell7/template/.github/workflows/reusable-security.yml@072c68a9d4b3fbaea886ad60ae54b6ebbef42bde # main
    permissions:
      contents: read
      security-events: write
      actions: read

  # The check that the ruleset of main names for the scans (template #81). It fails when the scans failed or were cancelled.
  # The scans stay in this file: release.yml calls ci.yml with contents: read, and a scan needs security-events: write.
  security-ok:
    name: Security OK
    if: always()
    needs: [security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each scan passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
