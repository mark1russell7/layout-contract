# This workflow reads pages of the live site in a browser, so a reading of a rendered page needs no local browser.
# It keeps a screenshot of each page at 1280 and 390, light and dark, and the text of the tags, as the artifact page-read.
# Start it with: gh workflow run page-read.yml -R mark1russell7/layout-contract -f pages="compare.html"
name: Page read

on:
  workflow_dispatch:
    inputs:
      pages:
        description: The pages to read, separated by spaces
        default: compare.html

concurrency:
  group: page-read-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.64.1"

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install the browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Read the pages
        working-directory: packages/site
        env:
          PAGES: ${{ inputs.pages }}
        run: |
          read -r -a list <<< "$PAGES"
          PLAYWRIGHT_DIR="$RUNNER_TEMP/pw" node scripts/page-read.ts https://mark1russell7.github.io/layout-contract "$RUNNER_TEMP/out" "${list[@]}"
          cat "$RUNNER_TEMP/out/tags.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: page-read
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 14
