# The joint benchmark of packages/joint (docs/JOINT-BENCH.md): each pair of a pack entry and a router on the corpus joint-v1.
# A pull request runs the small slice pr. A manual run, or a pull request with the label bench:full, runs the full corpus.
# The full run gives the inputs to the shards of a matrix. Each shard keeps its raw records as the artifact joint-records-<shard>.
# The job analyze joins the records and keeps the report as the artifact joint-report, in JSON and in Markdown.
# Only the times of these jobs count. The benchmark does not run on a local computer.
name: Joint bench

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "The count of the shards of the full run."
        type: string
        default: "48"
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: joint-bench-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'bench:full')) && 'full' || 'slice' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'bench:full')) }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      slice: ${{ steps.plan.outputs.slice }}
    steps:
      - name: Plan the matrix
        id: plan
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'bench:full') }}
          SHARDS: ${{ inputs.shards || '48' }}
        run: |
          if [ "$FULL" = "true" ]; then count="$SHARDS"; slice=""; else count=2; slice=pr; fi
          case "$count" in ''|*[!0-9]*) echo "The count of the shards is a number, not $count."; exit 1;; esac
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "slice=$slice" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq -s, 0 $((count - 1)) | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run one shard
        working-directory: packages/joint
        env:
          SHARD: ${{ matrix.shard }}
          COUNT: ${{ needs.plan.outputs.count }}
          SLICE: ${{ needs.plan.outputs.slice }}
        run: node scripts/bench.mjs run --shards "$COUNT" --shard "$SHARD" --out records ${SLICE:+--slice "$SLICE"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: joint-records-${{ matrix.shard }}
          path: packages/joint/records/*.jsonl
          if-no-files-found: error

  analyze:
    needs: [plan, run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: joint-records-*
          merge-multiple: true
          path: packages/joint/records
      - name: Analyze the records
        working-directory: packages/joint
        env:
          SLICE: ${{ needs.plan.outputs.slice }}
        run: |
          node scripts/bench.mjs analyze --records records --out report ${SLICE:+--slice "$SLICE"}
          ls records | wc -l
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joint-report
          path: packages/joint/report/
          if-no-files-found: error
