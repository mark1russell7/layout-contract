# The joint benchmark of packages/joint (docs/JOINT-BENCH.md): each pair of a pack entry and a router on a joint corpus.
# The input corpus selects the corpus. The default is joint-v2. A pull request runs the corpus joint-v2.
# The job check examines the claims of the corpus first. The job smoke routes 1 input of each value of spacing. A break stops the run.
# A pull request runs the small slice pr. A manual run, or a pull request with the label bench:full, runs the full corpus.
# The full run gives the inputs to the shards of a matrix by their predicted cost (planShards). Each shard keeps its raw records as the artifact joint-records-<shard>.
# The job analyze joins the records and keeps the report as the artifact joint-report, in JSON and in Markdown.
# The job analyze fails when an input of the manifest has no records. The report lists the missing inputs.
# On joint-v2, the report also gives the headline cell on the inputs of data/joint-v2-recorded.txt.
# Each report gives the gains over the baseline pair rows+portfolio (L10). With the records of select, it gives the numbers of the claims of L32.
# The jobs analyze and reanalyze read the jobs of the run with one call of gh run view. The report then gives the time of each shard.
# A manual run with the input records-run does not run the benchmark. The job reanalyze downloads the records of that earlier run and analyzes them.
# A manual run with the input lanes adds the lane pairs of L13 to each shard. The default plan does not change.
# A manual run with the input iterate adds the iteration pairs of L11 to each shard. The default plan does not change.
# A manual run with the input cover adds the pairs of each other strategy and each open router to each shard. The default plan does not change.
# A manual run with the input pairs runs only those pairs of the cover and the baseline pair, so a new strategy needs no whole cover run.
# A shard stops at a clean point after 330 minutes, so that the job limit does not lose its records. Each shard writes each pair when the pair ends.
# A manual run with the input pair-budget holds each stage of a pair to a time budget. A pair over it stops with a tag, so one strategy cannot take a shard.
# A run with the input cover or pairs and no pair-budget stops in the job plan (L141). With no budget, one pair that does not end can take a shard with no record.
# A manual run with the input resume-run runs only the pairs that the earlier run did not record, with the same stamp of the code and the same input hashes.
# A manual run with the inputs resume-run and carry also keeps the records of the earlier run over an engine release (L147, docs/JOINT-BENCH.md).
# The jobs probe, prior and carry-audit then compare the engines, keep the pairs with the same probes, and measure an audit sample again.
# Only the times of these jobs count. The benchmark does not run on a local computer.
# The weekly run (L160): the schedule, or a manual run with the input weekly, is a carry run from the newest run of
# packages/site/data/stamps.json, with the cover and a pair budget of 5. The job plan reads that run and gives the options
# resume-run, carry, cover and pair-budget to the later jobs. The age limit of the measured pages (14 days) needs this schedule.
name: Joint bench

on:
  schedule:
    # Each schedule of a repository and file has its own minute (the rule runner-budget of conventions).
    - cron: "14 4 * * 1"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Run as the weekly run: a carry run from the newest run of packages/site/data/stamps.json, with the cover and a pair budget of 5 (L160)."
        type: boolean
        default: false
      shards:
        description: "The count of the shards of the full run."
        type: string
        default: "64"
      corpus:
        description: "The joint corpus."
        type: choice
        options: [joint-v2, joint-v1, joint-v3]
        default: joint-v2
      records-run:
        description: "The id of an earlier full run. With it, only the job reanalyze runs, on the records of that run."
        type: string
        default: ""
      lanes:
        description: "Add the lane pairs of L13 (routing-aware gaps) to the run."
        type: boolean
        default: false
      iterate:
        description: "Add the iteration pairs of L11 (place, route, place again) to the run."
        type: boolean
        default: false
      cover:
        description: "Add the pairs of the cover: each other strategy of packing and each open router of highways."
        type: boolean
        default: false
      pairs:
        description: "Run only these pairs of the cover and the baseline pair, with commas. It replaces cover, lanes and iterate."
        type: string
        default: ""
      pair-budget:
        description: "The minutes of each stage of a pair, or a list by input size, for example 200:1,5. A pair over it stops with a tag. Empty is no budget."
        type: string
        default: ""
      resume-run:
        description: "The id of an earlier run with the same options. With it, this run keeps the records of that run and runs only the missing pairs."
        type: string
        default: ""
      confirm:
        description: "Run the confirmation of L40: 6 pairs on the fresh seeds 4 to 6. It replaces the options lanes and iterate."
        type: boolean
        default: false
      carry:
        description: "With resume-run: keep the records of that run over an engine release (L147). The probes compare the engines, and an audit measures a sample again."
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: joint-bench-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'bench:full')) && 'full' || 'slice' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'bench:full')) }}

defaults:
  run:
    shell: bash

jobs:
  check:
    if: ${{ !inputs.records-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the claims of the corpus
        working-directory: packages/joint
        env:
          CORPUS: ${{ inputs.corpus || 'joint-v2' }}
        run: node scripts/bench.mjs check --corpus "$CORPUS"

  smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Route 1 input of each value of spacing with corners
        working-directory: packages/joint
        env:
          CORPUS: ${{ inputs.corpus || 'joint-v2' }}
        run: node scripts/bench.mjs smoke --corpus "$CORPUS"

  # The flip of the deadline inside a shard (L115, `docs/SWEEP.md`). A real slow pair runs past the deadline as the first unit: its finished record stays, the row reads censored, and the job ends in time. A no-fault copy runs in the same job.
  stop-flip:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stop a slow first unit, and keep what ended
        working-directory: packages/joint
        run: node scripts/sweep-stop-flip.ts

  plan:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      slice: ${{ steps.plan.outputs.slice }}
      corpus: ${{ steps.plan.outputs.corpus }}
      resume-run: ${{ steps.plan.outputs.resume-run }}
      carry: ${{ steps.plan.outputs.carry }}
      cover: ${{ steps.plan.outputs.cover }}
      pair-budget: ${{ steps.plan.outputs.pair-budget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'schedule' || inputs.weekly }}
        with:
          persist-credentials: false
          sparse-checkout: packages/site/data
      - name: Plan the matrix
        id: plan
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'bench:full') }}
          WEEKLY: ${{ github.event_name == 'schedule' || inputs.weekly }}
          SHARDS: ${{ inputs.shards || '64' }}
          CORPUS: ${{ inputs.corpus || 'joint-v2' }}
          COVER: ${{ inputs.cover && 'on' || '' }}
          PAIRS: ${{ inputs.pairs }}
          PAIR_BUDGET: ${{ inputs.pair-budget }}
          CARRY: ${{ inputs.carry && 'on' || '' }}
          RESUME_RUN: ${{ inputs.resume-run }}
        run: |
          if [ "$WEEKLY" = "true" ]; then
            RESUME_RUN=$(jq -r '[.pages[] | select(.page == "index.html") | .runs[]] | sort_by(.date) | last | .id // empty' packages/site/data/stamps.json)
            case "$RESUME_RUN" in ''|*[!0-9]*) echo "::error::The stamps of index.html name no run, so the weekly run has no run to carry."; exit 1;; esac
            CARRY=on; COVER=on; PAIR_BUDGET="${PAIR_BUDGET:-5}"
            echo "The weekly run carries the records of the run $RESUME_RUN."
          fi
          if [ -n "$CARRY" ] && [ -z "$RESUME_RUN" ]; then echo "::error::The input carry needs the input resume-run: the run with the records to keep (L147)."; exit 1; fi
          if [ -n "$COVER$PAIRS" ] && [ -z "$PAIR_BUDGET" ]; then echo "::error::A run with the input cover or pairs has a pair-budget, for example 5. With no budget, one pair that does not end can take a shard with no record (L141)."; exit 1; fi
          echo "The pair budget of this run: ${PAIR_BUDGET:-none}"
          if [ "$FULL" = "true" ]; then count="$SHARDS"; slice=""; else count=2; slice=pr; fi
          case "$CORPUS" in joint-v1|joint-v2|joint-v3) ;; *) echo "The corpus is joint-v1, joint-v2 or joint-v3, not $CORPUS."; exit 1;; esac
          echo "corpus=$CORPUS" >> "$GITHUB_OUTPUT"
          { echo "resume-run=$RESUME_RUN"; echo "carry=$CARRY"; echo "cover=$COVER"; echo "pair-budget=$PAIR_BUDGET"; } >> "$GITHUB_OUTPUT"
          case "$count" in ''|*[!0-9]*) echo "The count of the shards is a number, not $count."; exit 1;; esac
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "slice=$slice" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq -s, 0 $((count - 1)) | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  # The probes of a carry (L147). The side from probes the engines of the lockfile of the earlier run, and the side to probes the engines of this checkout.
  # The code of the probe is the code of this checkout. When the measure code changed after the earlier run, the command carry makes a code bridge (L147 rule B).
  probe:
    needs: plan
    if: ${{ needs.plan.outputs.resume-run && needs.plan.outputs.carry }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        side: [from, to]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Find the commit of the earlier run
        id: from
        env:
          RESUME_RUN: ${{ needs.plan.outputs.resume-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RESUME_RUN" in ''|*[!0-9]*) echo "The input resume-run is a run id, not $RESUME_RUN."; exit 1;; esac
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN" --jq .head_sha)
          case "$sha" in ''|*[!0-9a-f]*) echo "The run $RESUME_RUN has no head commit: $sha."; exit 1;; esac
          git fetch --quiet --no-tags --depth=1 origin "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Install the engines of the earlier run
        if: ${{ matrix.side == 'from' }}
        working-directory: packages/joint
        env:
          SHA: ${{ steps.from.outputs.sha }}
        run: |
          engines=$(node scripts/bench.mjs carry-engines --commit "$SHA")
          echo "The engines of the earlier run: $engines" | tee -a "$GITHUB_STEP_SUMMARY"
          # The list has one name@version for each engine, so the shell splits it on purpose.
          # shellcheck disable=SC2086
          pnpm add $engines
      - name: Probe one shard of the engines
        working-directory: packages/joint
        shell: bash
        env:
          SIDE: ${{ matrix.side }}
          SHARD: ${{ matrix.shard }}
          SLICE: ${{ needs.plan.outputs.slice }}
          CORPUS: ${{ needs.plan.outputs.corpus }}
          COVER: ${{ needs.plan.outputs.cover }}
          PAIRS: ${{ inputs.pairs }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/bench.mjs carry-probe --corpus "$CORPUS" --shards 4 --shard "$SHARD" --out "probe/$SIDE-$SHARD.json" ${SLICE:+--slice "$SLICE"} ${PAIRS:+--pairs "$PAIRS"} ${COVER:+--cover on} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joint-carry-probe-${{ matrix.side }}-${{ matrix.shard }}
          path: packages/joint/probe/
          if-no-files-found: error

  # The job prior of a resume. It keeps the records of the earlier run that have the stamp of this code, as the artifact joint-records-prior.
  # The artifact name starts with joint-records-, so the job analyze and a later resume read these records with the records of this run.
  # With the input carry, the command carry keeps the records of the pairs whose probes agree at the two engine versions. The audit sample goes to joint-carry-audit.
  prior:
    needs: [plan, probe]
    if: ${{ !cancelled() && needs.plan.outputs.resume-run && needs.plan.result == 'success' && (needs.probe.result == 'success' || needs.probe.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check the run id
        env:
          RESUME_RUN: ${{ needs.plan.outputs.resume-run }}
        run: |
          case "$RESUME_RUN" in ''|*[!0-9]*) echo "The input resume-run is a run id, not $RESUME_RUN."; exit 1;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: joint-records-*
          merge-multiple: true
          path: packages/joint/prior-in
          run-id: ${{ needs.plan.outputs.resume-run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.plan.outputs.carry }}
        with:
          pattern: joint-carry-probe-from-*
          merge-multiple: true
          path: packages/joint/probe/from
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.plan.outputs.carry }}
        with:
          pattern: joint-carry-probe-to-*
          merge-multiple: true
          path: packages/joint/probe/to
      - name: Find the commit of the earlier run
        if: ${{ needs.plan.outputs.carry }}
        id: from
        env:
          RESUME_RUN: ${{ needs.plan.outputs.resume-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RESUME_RUN" in ''|*[!0-9]*) echo "The input resume-run is a run id, not $RESUME_RUN."; exit 1;; esac
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN" --jq .head_sha)
          case "$sha" in ''|*[!0-9a-f]*) echo "The run $RESUME_RUN has no head commit: $sha."; exit 1;; esac
          git fetch --quiet --no-tags --depth=1 origin "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Keep the pairs with the stamp of this code
        working-directory: packages/joint
        # This key adds pipefail. With the default shell a crash of a command under `tee` passes.
        shell: bash
        env:
          COUNT: ${{ needs.plan.outputs.count }}
          SLICE: ${{ needs.plan.outputs.slice }}
          CORPUS: ${{ needs.plan.outputs.corpus }}
          COVER: ${{ needs.plan.outputs.cover }}
          PAIRS: ${{ inputs.pairs }}
          PAIR_BUDGET: ${{ needs.plan.outputs.pair-budget }}
          CARRY: ${{ needs.plan.outputs.carry }}
          FROM_COMMIT: ${{ steps.from.outputs.sha }}
          RESUME_RUN: ${{ needs.plan.outputs.resume-run }}
        run: |
          if [ -n "$CARRY" ]; then
            node scripts/bench.mjs carry --corpus "$CORPUS" --records prior-in --from probe/from --to probe/to --from-commit "$FROM_COMMIT" --run "$RESUME_RUN" --out prior ${SLICE:+--slice "$SLICE"} ${PAIRS:+--pairs "$PAIRS"} ${PAIR_BUDGET:+--pair-budget "$PAIR_BUDGET"} ${COVER:+--cover on} | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/bench.mjs resume --corpus "$CORPUS" --records prior-in --out prior ${SLICE:+--slice "$SLICE"} ${PAIRS:+--pairs "$PAIRS"} ${PAIR_BUDGET:+--pair-budget "$PAIR_BUDGET"} ${COVER:+--cover on} | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/bench.mjs plan --corpus "$CORPUS" --shards "$COUNT" --prior prior/prior-pairs.ndjson ${SLICE:+--slice "$SLICE"} ${PAIRS:+--pairs "$PAIRS"} ${PAIR_BUDGET:+--pair-budget "$PAIR_BUDGET"} ${COVER:+--cover on} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joint-records-prior
          # Only the kept records and the pair lines. The job analyze reads each .jsonl file of joint-records-*, so the audit file stays out.
          path: packages/joint/prior/prior-*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ needs.plan.outputs.carry }}
        with:
          name: joint-carry-audit
          path: |
            packages/joint/prior/carry-audit.jsonl
            packages/joint/prior/carry.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joint-prior-pairs
          path: packages/joint/prior/prior-pairs.ndjson
          if-no-files-found: error

  run:
    needs: [plan, prior]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.prior.result == 'success' || needs.prior.result == 'skipped') }}
    runs-on: ubuntu-latest
    # One input of joint-v2 ran for more than 89 minutes in run 40666991882. 360 minutes is the limit of GitHub.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # The account runs at most 20 jobs at once, for all repos together. The fleet rule of 2026-10-30 (STRATEGY.md) gives a heavy workflow 3 jobs at once, so gates and releases get runners.
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.plan.outputs.resume-run }}
        with:
          name: joint-prior-pairs
          path: packages/joint/prior
      - name: Run one shard
        working-directory: packages/joint
        # The script stops at 330 minutes, after the pair that runs at that time. This limit stops one pair that runs for too long.
        # A step limit does not stop the job, so the upload after this step runs.
        timeout-minutes: 350
        env:
          PRIOR: ${{ needs.plan.outputs.resume-run && 'prior/prior-pairs.ndjson' || '' }}
          SHARD: ${{ matrix.shard }}
          COUNT: ${{ needs.plan.outputs.count }}
          SLICE: ${{ needs.plan.outputs.slice }}
          CORPUS: ${{ needs.plan.outputs.corpus }}
          LANES: ${{ inputs.lanes && 'on' || '' }}
          ITERATE: ${{ inputs.iterate && 'on' || '' }}
          COVER: ${{ needs.plan.outputs.cover }}
          PAIRS: ${{ inputs.pairs }}
          PAIR_BUDGET: ${{ needs.plan.outputs.pair-budget }}
          CONFIRM: ${{ inputs.confirm && 'on' || '' }}
          # 7 inputs of 1000 boxes went above the default heap of approximately 4 GB with 195 pairs in run 40815928586. The runner has 16 GB.
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/bench.mjs run --corpus "$CORPUS" --shards "$COUNT" --shard "$SHARD" --out records ${SLICE:+--slice "$SLICE"} ${LANES:+--lanes on} ${ITERATE:+--iterate on} ${CONFIRM:+--confirm on} ${PAIRS:+--pairs "$PAIRS"} ${PAIR_BUDGET:+--pair-budget "$PAIR_BUDGET"} ${COVER:+--cover on} ${PRIOR:+--prior "$PRIOR"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # A shard that failed or that a person cancelled still keeps each finished pair.
        if: ${{ always() }}
        with:
          name: joint-records-${{ matrix.shard }}
          path: |
            packages/joint/records/*.jsonl
            packages/joint/records/*.ndjson
          if-no-files-found: error

  # The audit of a carry (L147). The run measured the audit sample again. One pair with another record fails the job, so analyze does not run.
  carry-audit:
    needs: [plan, prior, run]
    if: ${{ !cancelled() && needs.plan.outputs.resume-run && needs.plan.outputs.carry && needs.prior.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: joint-carry-audit
          path: packages/joint/carry
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: joint-records-*
          merge-multiple: true
          path: packages/joint/records
      - name: Compare the audit pairs with the new records
        working-directory: packages/joint
        shell: bash
        run: |
          # The kept records are not new measures, so the audit reads only the records of the shards.
          rm -f records/prior-*
          cat carry/carry.json >> "$GITHUB_STEP_SUMMARY"
          node scripts/bench.mjs carry-audit --audit carry/carry-audit.jsonl --records records --out carry/audit.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: joint-carry-audit-result
          path: packages/joint/carry/audit.json
          if-no-files-found: error

  analyze:
    needs: [plan, run, carry-audit]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.carry-audit.result == 'success' || needs.carry-audit.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: joint-records-*
          merge-multiple: true
          path: packages/joint/records
      - name: Analyze the records
        working-directory: packages/joint
        env:
          SLICE: ${{ needs.plan.outputs.slice }}
          CORPUS: ${{ needs.plan.outputs.corpus }}
          CONFIRM: ${{ inputs.confirm && 'on' || '' }}
          PAIR_BUDGET: ${{ needs.plan.outputs.pair-budget }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ls records | wc -l
          if [ -n "$CONFIRM" ]; then
            node scripts/bench.mjs confirm --confirm on --corpus "$CORPUS" --records records --out report
            cat report/confirm.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          subset=""
          if [ "$CORPUS" = joint-v2 ]; then subset=data/joint-v2-recorded.txt; fi
          jobs=jobs.json
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > "$jobs" || { rm -f "$jobs"; jobs=""; }
          status=0
          node scripts/bench.mjs analyze --corpus "$CORPUS" --records records --out report ${SLICE:+--slice "$SLICE"} ${subset:+--subset "$subset"} ${jobs:+--jobs "$jobs"} || status=$?
          if [ -f report/report.md ]; then cat report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          mkdir -p report
          node scripts/bench.mjs costs --corpus "$CORPUS" --records records ${PAIR_BUDGET:+--pair-budget "$PAIR_BUDGET"} > report/pair-costs.md || status=$?
          cat report/pair-costs.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: joint-report
          path: packages/joint/report/
          if-no-files-found: error

  reanalyze:
    if: ${{ inputs.records-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check the run id
        env:
          RECORDS_RUN: ${{ inputs.records-run }}
        run: |
          case "$RECORDS_RUN" in ''|*[!0-9]*) echo "The input records-run is a run id, not $RECORDS_RUN."; exit 1;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: joint-records-*
          merge-multiple: true
          path: packages/joint/records
          run-id: ${{ inputs.records-run }}
          github-token: ${{ github.token }}
      - name: Analyze the records of the earlier run
        working-directory: packages/joint
        env:
          CORPUS: ${{ inputs.corpus || 'joint-v2' }}
          RECORDS_RUN: ${{ inputs.records-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "The records of run $RECORDS_RUN: $(ls records | wc -l) files."
          subset=""
          if [ "$CORPUS" = joint-v2 ]; then subset=data/joint-v2-recorded.txt; fi
          jobs=jobs.json
          gh run view "$RECORDS_RUN" --repo "$GITHUB_REPOSITORY" --json jobs > "$jobs" || { rm -f "$jobs"; jobs=""; }
          status=0
          node scripts/bench.mjs analyze --corpus "$CORPUS" --records records --out report ${subset:+--subset "$subset"} ${jobs:+--jobs "$jobs"} || status=$?
          if [ -f report/report.md ]; then { echo "Records of run $RECORDS_RUN."; echo; cat report/report.md; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: joint-report-of-${{ inputs.records-run }}
          path: packages/joint/report/
          if-no-files-found: error

  # One check for the jobs of the joint bench, for a ruleset (the model of CI OK in ci.yml).
  # A reanalyze run skips the jobs of the bench, and each other run skips reanalyze. Each other skip fails the check (template #85).
  # The bench stays in this file: release.yml calls ci.yml with contents: read, and analyze needs actions: read.
  joint-bench-ok:
    name: Joint bench OK
    if: ${{ !cancelled() }}
    needs: [check, smoke, stop-flip, plan, probe, prior, run, carry-audit, analyze, reanalyze]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass.
          # A resume with no carry skips probe and carry-audit.
          ALLOW_SKIP: ${{ inputs.records-run && 'check smoke stop-flip plan probe prior run carry-audit analyze' || (needs.plan.outputs.resume-run && (needs.plan.outputs.carry && 'reanalyze' || 'probe carry-audit reanalyze') || 'probe prior carry-audit reanalyze') }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
